<title>Webgewerk Aufgabenliste</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{
  --grund:#FAF8F4; --flaeche:#FFFFFF; --basis:#16181C; --text:#3A3A38;
  --gedaempft:#6B665C; --akzent:#A8681B; --akzent-weich:#F0E5D6;
  --linie:#E4DED4; --linie-stark:#CFC7B9;
  --sperr:#8A2C1E; --sperr-weich:#F6E4DF;
  --k:#1F5E8C; --y:#7A4E9E; --c:#2F6B4F;
  --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --grund:#141619; --flaeche:#1B1E23; --basis:#F2EEE6; --text:#C9C4BA;
    --gedaempft:#918B81; --akzent:#D89440; --akzent-weich:#33261A;
    --linie:#2A2D34; --linie-stark:#3A3E46;
    --sperr:#E08672; --sperr-weich:#33201C;
    --k:#6FAAD4; --y:#B694DC; --c:#79BF9C;
  }
}
:root[data-theme="dark"]{
  --grund:#141619; --flaeche:#1B1E23; --basis:#F2EEE6; --text:#C9C4BA;
  --gedaempft:#918B81; --akzent:#D89440; --akzent-weich:#33261A;
  --linie:#2A2D34; --linie-stark:#3A3E46;
  --sperr:#E08672; --sperr-weich:#33201C;
  --k:#6FAAD4; --y:#B694DC; --c:#79BF9C;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--grund);color:var(--text);font-family:var(--sans);
 font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
.bahn{max-width:50rem;margin:0 auto;padding:0 clamp(1.15rem,4vw,2.5rem)}
h1,h2,h3{color:var(--basis);font-weight:700;letter-spacing:-.012em;
 line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:clamp(1.9rem,4.6vw,2.7rem)}
h2{font-size:clamp(1.25rem,2.6vw,1.55rem)}
p{margin:0 0 .85rem;max-width:62ch}
a{color:var(--akzent)}
:focus-visible{outline:2px solid var(--akzent);outline-offset:3px}
code{font-family:var(--mono);font-size:.86em}
strong{color:var(--basis)}
.marke{display:flex;align-items:center;gap:.7rem;margin:0 0 1rem;
 font-family:var(--mono);font-size:11px;letter-spacing:.16em;
 text-transform:uppercase;color:var(--gedaempft)}
.marke::before{content:"";width:26px;height:1px;background:var(--akzent);flex:none}

header{padding:clamp(2.5rem,7vw,4rem) 0 1.6rem;border-bottom:2px solid var(--akzent);
 background:var(--flaeche)}
.unter{font-family:var(--mono);font-size:12px;color:var(--gedaempft);
 line-height:1.9;margin:.9rem 0 0}

.sperrblock{background:var(--sperr-weich);border-left:4px solid var(--sperr);
 padding:1.1rem 1.2rem;margin:1.5rem 0 0}
.sperrblock b{display:block;font-family:var(--mono);font-size:10.5px;
 letter-spacing:.11em;text-transform:uppercase;color:var(--sperr);margin-bottom:.3rem}
.sperrblock p{margin:0;font-size:15px}

section{padding:2.6rem 0 0}
.phase{display:flex;flex-wrap:wrap;align-items:baseline;gap:.5rem .9rem;
 border-top:1px solid var(--linie-stark);padding-top:1.3rem;margin-bottom:.3rem}
.phase h2{margin:0}
.wann{font-family:var(--mono);font-size:11px;letter-spacing:.1em;
 text-transform:uppercase;color:var(--gedaempft)}
.hinweis{color:var(--gedaempft);font-size:15px;margin:.5rem 0 1.2rem;max-width:60ch}

ul.liste{list-style:none;margin:0;padding:0}
ul.liste li{display:grid;grid-template-columns:1.5rem 3.2rem 6.2rem 1fr;gap:0 .7rem;
 padding:.8rem 0;border-bottom:1px solid var(--linie);align-items:start}
.kasten{width:15px;height:15px;border:1.5px solid var(--linie-stark);
 border-radius:2px;margin-top:.25rem}
.wer{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;
 text-transform:uppercase;font-weight:600;padding-top:.28rem;white-space:nowrap}
.w-k{color:var(--k)} .w-y{color:var(--y)} .w-c{color:var(--c)}
.w-b{color:var(--gedaempft)}
.kasten.haken{border-color:var(--c);color:var(--c);font-size:11px;
 line-height:12px;text-align:center;font-weight:700}
.frist{font-family:var(--mono);font-size:11px;letter-spacing:.04em;
 font-weight:600;color:var(--akzent);padding-top:.28rem}
.quelle{font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;
 color:var(--akzent);white-space:nowrap;margin-left:.4rem}
.was{font-size:15.5px}
.was em{font-style:normal;color:var(--gedaempft);display:block;font-size:14px;
 margin-top:.15rem}
li.wichtig .was strong{color:var(--sperr)}

.legende{display:flex;flex-wrap:wrap;gap:.5rem 1.5rem;margin:1.2rem 0 0;
 font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--gedaempft)}

.fertig{margin-top:3rem;border-top:1px solid var(--linie-stark);padding-top:1.5rem}
.fertig ul{list-style:none;margin:0;padding:0}
.fertig li{padding:.45rem 0 .45rem 1.5rem;position:relative;font-size:15px;
 color:var(--gedaempft);border-bottom:1px solid var(--linie)}
.fertig li::before{content:"✓";position:absolute;left:0;color:var(--c);
 font-weight:700}
footer{margin-top:2.5rem;border-top:1px solid var(--linie-stark);
 font-family:var(--mono);font-size:11.5px;color:var(--gedaempft);line-height:1.9}
footer .bahn{padding-block:1.4rem 2.5rem}

@media print{
  @page{margin:16mm}
  body{background:#fff;color:#000;font-size:10pt}
  .bahn{max-width:none;padding:0}
  .phase{break-after:avoid}
  li{break-inside:avoid}
  .kasten{border-color:#000}
}
@media(max-width:560px){
  ul.liste li{grid-template-columns:1.5rem 1fr;gap:.15rem .7rem}
  .wer{grid-column:2;padding-top:0}
  .frist{grid-column:2;padding-top:0}
}
</style>
